<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>TCRIA | The Cancer Endogenous Retrovirus Immunotherapy Atlas</title>
    <meta
      name="description"
      content="TCRIA, the Cancer Endogenous Retrovirus Immunotherapy Atlas: ERV expression, clinical association and tumour microenvironment across cancer cohorts."
    />
    <link rel="canonical" href="https://wanglabcsu.github.io/TCRIA-portal/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TCRIA" />
    <meta property="og:description" content="The Cancer Endogenous Retrovirus Immunotherapy Atlas" />
    <meta property="og:url" content="https://wanglabcsu.github.io/TCRIA-portal/" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#faf8f4" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --paper: #faf8f4;
        --wash: #f1ede6;
        --ink: #12212c;
        --ink-soft: #55636d;
        --rule: rgb(18 33 44 / 14%);
        --accent: #165c91;
        --accent-deep: #0d4a75;
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Songti SC",
          "Noto Serif CJK SC", Georgia, Cambria, "Times New Roman", serif;
      }

      html {
        height: 100%;
      }

      body {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: clamp(2rem, 6vw, 5rem) 1.5rem;
        background:
          radial-gradient(1100px 620px at 50% -18%, var(--wash) 0%, rgb(241 237 230 / 0%) 62%),
          var(--paper);
        color: var(--ink);
        font-family: var(--serif);
        font-size: 17px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      main {
        width: 100%;
        max-width: 34rem;
        text-align: center;
      }

      /* Provirus motif: LTR | internal region | LTR */
      .motif {
        display: block;
        width: 132px;
        height: 14px;
        margin: 0 auto clamp(2rem, 5vw, 2.75rem);
      }

      .wordmark {
        font-size: clamp(3.3rem, 9vw, 4.5rem);
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.045em;
        text-indent: 0.045em;
      }

      .tagline {
        max-width: 26rem;
        margin-top: 1rem;
        margin-inline: auto;
        font-size: 1.05rem;
        font-style: italic;
        line-height: 1.5;
        color: var(--ink-soft);
        text-wrap: balance;
      }

      .rule {
        width: 3.25rem;
        height: 0;
        margin: clamp(2rem, 4.5vw, 2.5rem) auto 1.35rem;
        border-top: 1px solid var(--rule);
      }

      .meta {
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .meta span {
        padding: 0 0.5rem;
        color: var(--rule);
      }

      .enter {
        display: inline-block;
        margin-top: clamp(2.1rem, 5vw, 2.75rem);
        padding: 0.78rem 1.9rem 0.82rem;
        border: 1px solid var(--accent-deep);
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: 0.74rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-indent: 0.18em;
        text-transform: uppercase;
        text-decoration: none;
        transition: background-color 0.16s ease, transform 0.16s ease;
      }

      .enter:hover {
        background: var(--accent-deep);
        transform: translateY(-1px);
      }

      .enter:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      footer {
        margin-top: clamp(3.5rem, 9vw, 5.5rem);
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        color: var(--ink-soft);
      }

      footer a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 1px;
      }

      footer a:hover {
        color: var(--accent);
        border-bottom-color: currentcolor;
      }

      @media (prefers-reduced-motion: reduce) {
        .enter {
          transition: none;
        }

        .enter:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="motif" viewBox="0 0 132 14" role="presentation" aria-hidden="true" focusable="false">
        <rect x="0" y="2" width="24" height="10" rx="1" fill="#165c91" opacity="0.55" />
        <rect x="31" y="0" width="70" height="14" rx="1" fill="#165c91" opacity="0.18" />
        <rect x="108" y="2" width="24" height="10" rx="1" fill="#165c91" opacity="0.55" />
      </svg>

      <h1 class="wordmark">TCRIA</h1>
      <p class="tagline">The Cancer Endogenous Retrovirus Immunotherapy Atlas</p>

      <div class="rule" role="presentation"></div>
      <p class="meta">
        ERVmap<span>|</span>SQuIRE<span>|</span>Telescope<span>|</span>TEtranscripts
      </p>

      <a class="enter" href="http://biotree.top:38123/tcria/">Enter the atlas</a>

      <footer>
        <a href="https://github.com/WangLabCSU">WangLab</a> | Central South University
      </footer>
    </main>
  </body>
</html>
